[package]
name = "claude-reaper"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Gracefully stops Claude Code sessions that have been idle too long"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
croner = "4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
