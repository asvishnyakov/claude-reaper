[package]
name = "claude-reaper"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Gracefully stops Claude Code sessions that have been idle too long"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
croner = "4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
