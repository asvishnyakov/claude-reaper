name: integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'probes/**'
      - '.github/workflows/integration.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            reaper: target/debug/claude-reaper
          - os: macos-latest
            label: macos
            reaper: target/debug/claude-reaper
          - os: windows-latest
            label: windows
            reaper: target/debug/claude-reaper.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
      - uses: ./.github/actions/install-claude-code
      - run: cargo build --locked
      - name: Stop a real session with claude-reaper
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # --no-build: only hash-locked wheels run here; a source build would fetch an unpinned build backend.
        run: uv run --locked --no-build probes/probe.py --os ${{ matrix.label }} --integration ${{ matrix.reaper }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-results-${{ matrix.label }}
          path: results/
