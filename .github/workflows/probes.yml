name: probes

on:
  workflow_dispatch:
  push:
    paths:
      - 'probes/**'
      - '.github/workflows/probes.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: claude --version
      - name: Run probes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run probes/probe.py --os ${{ matrix.label }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-results-${{ matrix.label }}
          path: results/
